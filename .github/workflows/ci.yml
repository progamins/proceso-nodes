name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          set +e
          npm test > /tmp/test-out.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(tail -80 /tmp/test-out.log)
          fi
          exit $status

      - name: Security audit
        run: npm audit --omit=dev
